[package]
name = "burgentruck-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
minstant = { version = "0.1.7", features = ["coarsetime"] }
rand = "0.9.2"
shakmaty = { version = "0.29.4", features = ["nohash-hasher", "variant"] }
shakmaty-syzygy = "0.27.0"

[profile.dev]
opt-level = 2

[profile.release]
debug = true
